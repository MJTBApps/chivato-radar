name: Actualizar radares y publicar la web

# Repositorio público MJTBApps/chivato-radar: web de soporte, privacidad y la base de
# radares que descarga la app (radares.json). Cada lunes regenera la base con
# actualizar_radares.py (copia de scripts/ del repositorio de la app) y publica todo
# en GitHub Pages. Si la base nueva sale rara, se queda la anterior.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Regenerar la base de radares
        if: github.event_name != 'push' || hashFiles('radares.json') == ''
        continue-on-error: true
        run: |
          set -e
          python3 actualizar_radares.py --salida nuevo.json
          python3 - <<'EOF'
          import json, os, sys
          nueva = json.load(open("nuevo.json"))["radares"]
          if len(nueva) < 3000:
              sys.exit(f"Solo {len(nueva)} radares: me quedo con la base anterior")
          if os.path.exists("radares.json"):
              vieja = json.load(open("radares.json"))["radares"]
              if len(nueva) < 0.9 * len(vieja):
                  sys.exit(f"Baja de {len(vieja)} a {len(nueva)} radares: me quedo con la anterior")
          EOF
          mv nuevo.json radares.json
          git config user.name "Chivato Radar Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radares.json
          git diff --cached --quiet || { git commit -m "Base de radares del $(date +%F)"; git push; }

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
